[package]
name = "cloudy-clip"
version = "0.1.0"
description = "Cloudy Clip: an open-source, agent-friendly video editor"
authors = ["Cloudy Studio"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cloudy_clip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process"] }
axum = "0.8"
rmcp = { version = "3.7", default-features = false, features = ["server", "transport-streamable-http-server"] }
getrandom = "0.3"
tokio-util = { version = "0.7.20", features = ["io"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same version Tauri uses; for WebKitGTK workarounds (src/webview).
webkit2gtk = "2.0"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
