<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cloudy Clip · Option B · Mesa de luz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Courier+Prime:wght@400;700&family=Shantell+Sans:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* An animator's light table. Sheets of cold paper on a lit desk, roughs in non-photo blue,
         final lines in graphite, corrections in red pencil. */
      :root {
        --table: #c6dbea;
        --table-2: #b4cfe2;
        --paper: #f4f9fc;
        --paper-2: #e7f1f8;
        --rule: #bcd6e8;
        --rule-2: #8db9d6;
        --blue: #3d94cd;
        --ink: #22272e;
        --ink-2: #566472;
        --ink-3: #7e8e9c;
        --red: #d22f27;
        --hand: "Shantell Sans", sans-serif;
        --body: "Atkinson Hyperlegible", sans-serif;
        --mono: "Courier Prime", monospace;
        --head: 66px;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { height: 100%; margin: 0; }
      body { background: var(--table); color: var(--ink); font: 400 13px/1.35 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
      button, input { font: inherit; color: inherit; }
      button { background: none; border: 0; cursor: pointer; }
      :focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
      .ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

      .app { height: 100%; display: grid; grid-template-rows: 48px 1fr; }

      .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; padding: 0 12px; background: var(--table-2); }
      .brand { align-self: center; display: flex; align-items: center; gap: 8px; }
      .brand .seal-use { width: 36px; height: 30px; }
      .word { font: 800 19px/1 var(--hand); letter-spacing: -0.01em; }
      .project { margin-left: 12px; color: var(--ink-2); font: 400 13px var(--mono); }

      /* Index tabs: a tab is the edge of the sheet below it, so the active one joins its sheet */
      .pages { display: flex; gap: 3px; align-items: flex-end; }
      .pg { height: 34px; padding: 0 18px; color: var(--ink-2); font: 700 14px/1 var(--hand); background: var(--table); border-radius: 4px 4px 0 0; }
      .pg:hover { color: var(--ink); }
      .pg.is-active { height: 38px; color: var(--ink); background: var(--paper); box-shadow: inset 0 2px 0 var(--red); }
      .right { align-self: center; display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
      .icon { width: 30px; height: 30px; display: grid; place-items: center; color: var(--ink-2); border-radius: 3px; }
      .icon:hover { color: var(--ink); background: rgb(255 255 255 / 0.5); }
      .av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 11px var(--body); background: var(--ink); color: var(--paper); }
      .av.claude { background: #f4efe6; color: #c15f3c; font-size: 14px; margin-left: 8px; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 3px; font: 700 13.5px/1 var(--hand); }
      .btn-primary { background: var(--ink); color: var(--paper); }
      .btn-primary:hover { background: #3a4350; }
      .top .btn-primary { background: var(--red); margin-left: 8px; }
      .top .btn-primary:hover { background: #b9251e; }
      .btn-sm { height: 28px; padding: 0 9px; }
      .btn-wide { width: 100%; }

      .page { min-height: 0; background: var(--paper); }
      .edit { height: 100%; display: grid; grid-template-columns: 286px minmax(0, 1fr) 290px; grid-template-rows: minmax(0, 1fr) 300px; background: var(--table); gap: 0; }

      /* Library sheet */
      .lib { background: var(--paper); border-right: 1px solid var(--rule-2); display: flex; flex-direction: column; min-height: 0; }
      .ltabs { flex: none; display: flex; gap: 0; padding: 8px 8px 0; background: var(--paper-2); border-bottom: 1px solid var(--rule-2); }
      .ltab { flex: auto; height: 28px; padding: 0 7px; font: 700 12.5px/1 var(--hand); color: var(--ink-2); border-radius: 3px 3px 0 0; }
      .ltab:hover { color: var(--ink); }
      .ltab.is-active { background: var(--paper); color: var(--ink); box-shadow: 0 1px 0 var(--paper), inset 0 0 0 1px var(--rule-2); clip-path: inset(0 -1px 0 -1px); }
      .ltab .ico { display: none; }
      .pane { flex: 1; min-height: 0; overflow: auto; }
      .pane-head { display: flex; gap: 6px; padding: 10px; }
      .search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 2px; border-bottom: 1.5px solid var(--ink-3); color: var(--ink-3); }
      .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--ink); }
      .search:focus-within { border-color: var(--blue); }

      .bin { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 8px; padding: 0 10px 14px; }
      .bin-item { margin: 0; }
      .thumb { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
      .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .dur { position: absolute; right: 0; bottom: 0; padding: 0 3px; font: 700 10.5px var(--mono); background: var(--paper); }
      .bin-item figcaption { margin-top: 4px; font-size: 12px; color: var(--ink-2); }
      .bin-item.is-used figcaption { color: var(--red); font-weight: 700; }
      .bin-item.is-used .thumb { box-shadow: 0 0 0 2px var(--red); }

      .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 8px; padding: 0 10px 14px; }
      .preset { display: flex; flex-direction: column; gap: 3px; text-align: left; font-size: 12px; color: var(--ink-2); padding: 0; }
      .preset-art { height: 62px; display: grid; place-items: center; background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--rule); color: var(--ink); font: 800 24px var(--hand); }
      .preset:hover .preset-art { box-shadow: inset 0 0 0 1.5px var(--blue); }
      .pv-caption .preset-art { font: 700 15px var(--body); }
      .pv-lower .preset-art { font: 700 15px var(--body); place-items: end start; padding: 8px; }
      .pv-meme .preset-art { font: 700 24px var(--mono); }
      .pv-outline .preset-art { color: transparent; -webkit-text-stroke: 1px var(--ink); }
      .pv-note .preset-art { font: 500 16px var(--hand); color: var(--blue); }

      .group-title { margin: 0; padding: 2px 10px 8px; font: 700 13px var(--hand); }
      .stickers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 0 10px 14px; }
      .sticker { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 2px 6px; font-size: 11px; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--rule); }
      .sticker:hover { box-shadow: inset 0 0 0 1.5px var(--blue); }
      .sticker .seal-use { width: 56px; height: 47px; overflow: visible; }
      .st-squish { transform: scale(1.14, 0.72); } .st-tall { transform: scale(0.72, 1.14); } .st-tilt { transform: rotate(-16deg); } .st-side { transform: rotate(90deg) scale(0.86); } .st-flip { transform: rotate(180deg); }

      .trans { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 8px; padding: 10px; }
      .tr-card { text-align: left; font-size: 12px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; padding: 0; }
      .tr-art { display: flex; aspect-ratio: 16 / 9; overflow: hidden; box-shadow: 0 0 0 1px var(--ink); }
      .tr-art img { width: 50%; object-fit: cover; }
      .tr-card.is-used { color: var(--red); font-weight: 700; }
      .tr-card.is-used .tr-art { box-shadow: 0 0 0 2px var(--red); }

      /* Stage: footage sits on the lit table inside a field guide, the animator's frame chart */
      .stage { min-width: 0; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) 44px; }
      .frame-wrap { position: relative; min-height: 0; display: grid; place-items: center; padding: 26px; container-type: size;
        background: linear-gradient(var(--rule-2), var(--rule-2)) center / 100% 1px no-repeat, linear-gradient(var(--rule-2), var(--rule-2)) center / 1px 100% no-repeat; }
      .frame { position: relative; width: min(100cqw, calc(100cqh * 16 / 9)); aspect-ratio: 16 / 9; background: #000; box-shadow: 0 0 0 1px var(--ink); }
      .frame > img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .frame::before, .frame::after { content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none; }
      .frame::before { left: -9px; top: -9px; border-left: 1.5px solid var(--red); border-top: 1.5px solid var(--red); }
      .frame::after { right: -9px; bottom: -9px; border-right: 1.5px solid var(--red); border-bottom: 1.5px solid var(--red); }
      .caption { position: absolute; inset: auto 0 11% 0; text-align: center; font: 700 clamp(16px, 3.4cqw, 34px)/1 var(--body); color: #fff; text-shadow: 0 2px 0 #000, 0 0 6px #000; }
      .transport { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 12px; background: var(--paper); border-top: 1px solid var(--rule-2); }
      .tc { font: 700 17px var(--mono); }
      .tc span { color: var(--ink-3); font-size: 13px; font-weight: 400; }
      .tp-btns { display: flex; align-items: center; gap: 2px; }
      .tp-play { width: 34px; height: 34px; display: grid; place-items: center; background: var(--ink); color: var(--paper); border-radius: 50%; margin: 0 6px; }
      .tp-play .ico { fill: currentColor; }
      .tp-right { justify-self: end; color: var(--ink-2); font: 400 12.5px var(--mono); }

      /* Inspector sheet */
      .insp { background: var(--paper); border-left: 1px solid var(--rule-2); min-height: 0; overflow: auto; }
      .insp-title { padding: 10px 12px 0; font: 800 17px/1.1 var(--hand); }
      .insp-title span { display: block; margin-top: 1px; font: 400 12px var(--mono); color: var(--ink-3); }
      .itabs { display: flex; gap: 14px; padding: 8px 12px 0; border-bottom: 1px solid var(--rule-2); }
      .itab { height: 26px; padding: 0; color: var(--ink-2); font: 700 13px/1 var(--hand); }
      .itab:hover { color: var(--ink); }
      .itab.is-active { color: var(--ink); box-shadow: inset 0 -2px 0 var(--red); }
      .sect { padding: 12px; border-bottom: 1px dashed var(--rule-2); }
      .sect h4 { display: flex; justify-content: space-between; align-items: center; margin: 0 0 8px; font: 700 13.5px var(--hand); }
      .sect-reset { padding: 0; color: var(--ink-3); }
      .sect-reset .ico { width: 13px; height: 13px; }
      .prop { display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 8px; min-height: 28px; color: var(--ink-2); }
      .prop:not(.has-slider) .val { grid-column: 3; }
      .val { font: 700 13px var(--mono); color: var(--ink); min-width: 58px; text-align: right; border-bottom: 1px solid var(--rule-2); padding: 2px 0; }
      .val small { font-size: 11px; font-weight: 400; color: var(--ink-3); margin-left: 2px; }
      .prop.is-changed .val { color: var(--red); border-color: var(--red); }
      .slider { height: 1.5px; background: var(--rule-2); position: relative; }
      .slider i { position: absolute; inset: 0 auto 0 0; background: var(--ink); }
      .slider i::after { content: ""; position: absolute; right: -5px; top: -4.5px; width: 10px; height: 10px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--ink); }
      .seg { display: flex; gap: 14px; }
      .seg button { padding: 3px 0; color: var(--ink-2); font: 700 13px var(--hand); }
      .seg .is-active { color: var(--ink); box-shadow: inset 0 -2px 0 var(--red); }
      .kv { display: flex; justify-content: space-between; min-height: 26px; align-items: center; color: var(--ink-2); }
      .kv b { font-weight: 700; color: var(--ink); }

      /* Timeline: the exposure sheet, held by a peg bar */
      .tl { grid-column: 1 / -1; position: relative; display: flex; flex-direction: column; min-height: 0; background: var(--paper); border-top: 1px solid var(--rule-2); }
      .tl-tools { position: relative; height: 34px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 8px; background: var(--paper-2); border-bottom: 1px solid var(--rule-2); }
      .tl-tools .grow { flex: 1; }
      .tl-tools .note { font: 400 12.5px var(--mono); color: var(--ink-2); }
      .pegs { position: absolute; left: 50%; top: 9px; transform: translateX(-50%); display: flex; gap: 120px; align-items: center; }
      .pegs i { display: block; width: 34px; height: 13px; border-radius: 7px; background: var(--table-2); box-shadow: inset 0 1px 2px rgb(34 39 46 / 0.45); }
      .pegs i:nth-child(2) { width: 15px; height: 15px; border-radius: 50%; }
      #timeline { position: relative; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column;
        background: repeating-linear-gradient(90deg, var(--rule) 0 1px, transparent 1px calc((100% - var(--head)) / 20)) var(--head) 0 / 100% 100% no-repeat; }
      .tl-row { display: grid; grid-template-columns: var(--head) 1fr; flex: 1; border-bottom: 1px solid var(--rule); min-height: 0; }
      .tl-row.is-main { flex: 1.7; }
      .tl-ruler { flex: none; height: 24px; border-bottom: 1.5px solid var(--ink); }
      .tl-corner, .tl-head { background: var(--paper-2); border-right: 1.5px solid var(--ink); }
      .tl-head { display: flex; align-items: center; justify-content: center; color: var(--ink-2); }
      .tl-id { font: 700 14px var(--mono); }
      .tl-id .ico, .tl-btns { display: none; }
      .ruler, .lane { position: relative; overflow: hidden; }
      .tick { position: absolute; bottom: 0; width: 1px; height: 5px; background: var(--ink-3); }
      .tick.is-major { height: 100%; background: var(--ink); }
      .tick b { position: absolute; left: 4px; bottom: 4px; font: 700 12px var(--mono); }

      .clip { position: absolute; top: 3px; bottom: 3px; overflow: hidden; display: flex; align-items: center; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
      .film { position: absolute; inset: 0; background-size: auto 100%; background-repeat: repeat-x; }
      .clip-name { position: relative; padding: 0 6px; font-size: 12px; white-space: nowrap; }
      .k-video .clip-name { align-self: flex-end; background: var(--paper); padding: 0 5px; font: 700 12px var(--mono); border-top: 1px solid var(--ink); border-right: 1px solid var(--ink); }
      .k-text { background: #ffe9a8; font-weight: 700; }
      .k-sticker { background: #cfe6f5; box-shadow: inset 0 0 0 1px var(--blue); }
      .k-audio { background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--rule-2); }
      .wave { position: absolute; inset: 20% 0 8%; width: 100%; height: 72%; fill: var(--ink-2); }
      .k-audio .clip-name { align-self: flex-start; font: 400 11.5px var(--mono); margin-top: 1px; background: var(--paper-2); }
      .k-video.is-sel { overflow: visible; z-index: 3; }
      .pencil { position: absolute; inset: -4px -5px; width: calc(100% + 10px); height: calc(100% + 8px); fill: none; stroke: var(--red); stroke-width: 2; stroke-linecap: round; pointer-events: none; }
      .pencil path { vector-effect: non-scaling-stroke; }
      /* A dissolve on film stock is marked with a long pencil X across the join */
      .cut { position: absolute; top: 3px; bottom: 3px; width: 44px; margin-left: -22px; z-index: 4;
        background: linear-gradient(to top right, transparent 48.4%, var(--red) 48.4%, var(--red) 51.6%, transparent 51.6%), linear-gradient(to bottom right, transparent 48.4%, var(--red) 48.4%, var(--red) 51.6%, transparent 51.6%); }

      .playhead { position: absolute; top: 0; bottom: 0; left: calc(var(--head) + (100% - var(--head)) * var(--at)); width: 2px; margin-left: -1px; background: var(--red); z-index: 5; pointer-events: none; }
      .playhead::before { content: ""; position: absolute; top: 0; left: -5px; border: 6px solid transparent; border-top: 9px solid var(--red); }

      /* Other pages */
      .sheet { height: 100%; overflow: auto; padding: 26px 34px;
        background: linear-gradient(var(--rule) 1px, transparent 1px) 0 0 / 100% 26px var(--paper); }
      .sheet h1 { margin: 0 0 20px; font: 800 30px/1 var(--hand); }
      .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px 16px; }
      .lib-card { margin: 0; }
      .lib-card figcaption { display: flex; flex-direction: column; margin-top: 6px; background: var(--paper); }
      .lib-card figcaption span { font: 400 12px var(--mono); color: var(--ink-2); }
      .queue { list-style: none; padding: 0; margin: 0; max-width: 820px; background: var(--paper); }
      .job { display: grid; grid-template-columns: 112px 1fr auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule-2); }
      .job img { width: 112px; aspect-ratio: 16 / 9; object-fit: cover; display: block; box-shadow: 0 0 0 1px var(--ink); }
      .job-text { display: flex; flex-direction: column; gap: 2px; }
      .job-text b { font: 700 15px var(--hand); }
      .job-text span { font: 400 12.5px var(--mono); color: var(--ink-2); }
      .bar { height: 3px; margin-top: 5px; background: var(--paper-2); }
      .bar i { display: block; height: 100%; background: var(--ink); }
      .is-running .bar i { background: var(--red); }
      .job-state { font: 700 13px var(--mono); color: var(--ink-2); }
      .is-running .job-state { color: var(--red); }

      .empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; background: var(--paper); }
      .empty h1 { margin: 0; font: 800 30px/1 var(--hand); }
      .empty p { margin: 0; max-width: 40ch; color: var(--ink-2); font-size: 14px; }
      .rough { width: 300px; height: 250px; margin-bottom: 8px; overflow: visible; }
      .rough .bluep { stroke: var(--blue); stroke-width: 0.5; fill: none; opacity: 0.75; }
      .rough .graph { stroke: var(--ink); stroke-width: 1.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .rough .spots { fill: var(--ink); opacity: 0.32; }
      .rough .graph, .rough .bluep { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.9s ease-out forwards; }
      .rough .graph { animation-delay: 0.7s; animation-duration: 1.1s; }
      .rough .spots, .rough .fillin { opacity: 0; animation: appear 0.4s 1.7s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes appear { to { opacity: 1; } }
      .rough .spots { animation-name: appear-soft; }
      @keyframes appear-soft { to { opacity: 0.32; } }
      @media (max-width: 1100px) { .edit { grid-template-columns: 240px minmax(0, 1fr); } .insp { display: none; } }
      @media (prefers-reduced-motion: reduce) { .rough * { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 !important; } }
    </style>
  </head>
  <body>
    <!-- The seal as a rough: a blue construction sphere, then graphite on top. It's a circle first, which is the joke. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="seal" viewBox="0 0 120 100">
        <g fill="none" stroke="#3d94cd" stroke-width="0.9" opacity="0.8">
          <circle cx="60" cy="50" r="46" />
          <path d="M6 50c20 8 88 8 108 0M60 2c-8 30-8 66 0 96" />
        </g>
        <path d="M60 6c30 0 54 20 54 49 0 25-24 39-54 39S6 80 6 55C6 26 30 6 60 6z" fill="#f4f9fc" fill-opacity="0.75" stroke="#22272e" stroke-width="2.2" />
        <g fill="#22272e" opacity="0.28">
          <ellipse cx="38" cy="19" rx="5" ry="3.2" transform="rotate(-24 38 19)" /><ellipse cx="53" cy="13" rx="3.2" ry="2.2" /><ellipse cx="70" cy="15" rx="5.2" ry="3" /><ellipse cx="86" cy="23" rx="4.2" ry="2.8" transform="rotate(30 86 23)" /><ellipse cx="24" cy="33" rx="3.6" ry="2.6" /><ellipse cx="97" cy="36" rx="3.8" ry="2.6" /><ellipse cx="22" cy="68" rx="3.8" ry="2.6" /><ellipse cx="96" cy="70" rx="4" ry="2.6" />
        </g>
        <ellipse cx="40" cy="49" rx="6.4" ry="4.4" transform="rotate(10 40 49)" fill="#22272e" />
        <ellipse cx="80" cy="49" rx="6.4" ry="4.4" transform="rotate(-10 80 49)" fill="#22272e" />
        <path d="M60 58c-7-1-16 1-16 8 0 6 10 9 16 4 6 5 16 2 16-4 0-7-9-9-16-8z" fill="#f4f9fc" stroke="#22272e" stroke-width="1.9" />
        <path d="M55.5 56.5h9l-4.5 5z" fill="#22272e" stroke="#22272e" stroke-width="1.6" stroke-linejoin="round" />
      </symbol>
    </svg>

    <div class="app">
      <header class="top">
        <div class="brand">
          <svg class="seal-use" viewBox="0 0 120 100" aria-hidden="true"><use href="#seal" /></svg>
          <span class="word">cloudy clip</span>
          <span class="project">focas_saltando_por_el_mundo</span>
        </div>
        <nav class="pages" role="tablist" aria-label="Pages">
          <button class="pg" data-go="page:edit">Edit</button>
          <button class="pg" data-go="page:media">Media</button>
          <button class="pg" data-go="page:sound">Sound</button>
          <button class="pg" data-go="page:export">Export</button>
        </nav>
        <div class="right">
          <button class="icon" data-i="undo" title="Undo"></button>
          <button class="icon" data-i="redo" title="Redo"></button>
          <span class="av claude" title="Claude Code">✳</span><span class="av" title="You">M</span>
          <button class="btn btn-primary" data-i="export">Export</button>
        </div>
      </header>

      <main class="page" data-show="page:edit">
        <div class="edit">
          <aside class="lib">
            <nav class="ltabs" role="tablist" aria-label="Library">
              <button class="ltab" data-go="tool:media">Media</button>
