<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cloudy Clip · Option A · Estación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Big+Shoulders+Stencil:wght@700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* A seal rescue station. Deep harbor water, buoy orange for what you're touching, the yellow
         research tag for where you are. */
      :root {
        --deep: #12323b;
        --deep-2: #17404a;
        --deep-3: #1f4f5a;
        --hull: #0b2329;
        --line: #2a5863;
        --frost: #e7f1ef;
        --ice: #9dbdc1;
        --ice-dim: #6c9096;
        --buoy: #ff5b2e;
        --tag: #f6c41a;
        --tag-ink: #2a2200;
        --kelp: #3f8f7c;
        --sign: "Barlow Condensed", sans-serif;
        --body: "Barlow", sans-serif;
        --mono: "IBM Plex Mono", monospace;
        --head: 92px;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--hull); color: var(--frost); font: 400 13px/1.35 var(--body);
        overflow: hidden; -webkit-font-smoothing: antialiased;
      }
      button, input { font: inherit; color: inherit; }
      button { background: none; border: 0; cursor: pointer; }
      :focus-visible { outline: 2px solid var(--tag); outline-offset: 1px; }
      .ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

      .app { height: 100%; display: grid; grid-template-rows: 46px 1fr; }

      /* Top bar */
      .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: var(--deep); border-bottom: 1px solid var(--line); padding: 0 12px; }
      .brand { display: flex; align-items: center; gap: 9px; }
      .brand .seal-use { width: 34px; height: 29px; }
      .word { font: 800 23px/1 "Big Shoulders Stencil", sans-serif; letter-spacing: 0.05em; }
      .project { margin-left: 14px; padding-left: 14px; border-left: 1px solid var(--line); color: var(--ice); font-size: 13px; }
      .project b { color: var(--frost); font-weight: 500; }

      /* The signature: a punched flipper tag marks where you are */
      .pages { display: flex; gap: 2px; height: 100%; align-items: center; }
      .pg, .rail-tab {
        position: relative; display: inline-flex; align-items: center; gap: 7px; color: var(--ice);
        font: 600 15px/1 var(--sign); letter-spacing: 0.07em; text-transform: uppercase;
      }
      .pg { height: 30px; padding: 0 16px 0 22px; clip-path: polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 72%, 0 28%); }
      .pg::before, .rail-tab::before { content: ""; position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--deep); opacity: 0; }
      .pg::before { left: 7px; top: 11.5px; }
      .pg:hover { color: var(--frost); background: var(--deep-2); }
      .pg.is-active { background: var(--tag); color: var(--tag-ink); }
      .pg.is-active::before, .rail-tab.is-active::before { opacity: 1; }

      .right { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
      .icon { width: 30px; height: 30px; display: grid; place-items: center; color: var(--ice); }
      .icon:hover { color: var(--frost); background: var(--deep-2); }
      .avatars { display: flex; align-items: center; gap: 6px; margin: 0 8px; padding: 0 10px; border-inline: 1px solid var(--line); height: 26px; }
      .av { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--body); background: var(--kelp); color: #06201b; }
      .av.claude { background: #f4efe6; color: #c15f3c; font-size: 14px; }

      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 2px; font: 600 14px/1 var(--sign); letter-spacing: 0.06em; text-transform: uppercase; }
      .btn-primary { background: var(--buoy); color: #240800; }
      .btn-primary:hover { background: #ff7650; }
      .btn-sm { height: 28px; padding: 0 9px; }
      .btn-wide { width: 100%; }

      /* Work area */
      .page { min-height: 0; }
      .edit { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) 286px; }
      .upper { min-height: 0; display: grid; grid-template-columns: 76px 280px minmax(0, 1fr) 296px; }

      .rail { background: var(--deep); border-right: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; }
      .rail-tab { width: 100%; height: 54px; flex-direction: column; justify-content: center; gap: 5px; font-size: 12.5px; letter-spacing: 0.05em; padding-left: 7px; }
      .rail-tab:hover { color: var(--frost); }
      .rail-tab.is-active {
        background: var(--tag); color: var(--tag-ink);
        clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 18px, 100% calc(100% - 18px), calc(100% - 10px) 100%, 0 100%);
      }
      .rail-tab::before { right: 6px; top: 23.5px; background: var(--deep); }

      .pane, .insp { background: var(--deep-2); min-height: 0; overflow: auto; }
      .pane { border-right: 1px solid var(--line); }
      .insp { border-left: 1px solid var(--line); display: flex; flex-direction: column; }
      .pane-title, .sect h4, .group-title { font: 600 14px/1 var(--sign); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ice); margin: 0; }
      .pane-title { padding: 12px 12px 2px; color: var(--frost); font-size: 16px; }
      .pane-head { display: flex; gap: 6px; padding: 10px 12px; }
      .search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; background: var(--deep); border: 1px solid var(--line); color: var(--ice-dim); }
      .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--frost); }
      .search input::placeholder { color: var(--ice-dim); }
      .search:focus-within { border-color: var(--tag); }

      .bin { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 8px; padding: 2px 12px 14px; }
      .bin-item { margin: 0; }
      .thumb { position: relative; aspect-ratio: 16 / 9; background: var(--hull); overflow: hidden; }
      .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .dur { position: absolute; right: 3px; bottom: 3px; padding: 1px 4px; font: 500 10px var(--mono); background: rgb(11 35 41 / 0.85); }
      .bin-item figcaption { margin-top: 4px; font-size: 12px; color: var(--ice); }
      .bin-item.is-used .thumb { outline: 2px solid var(--tag); outline-offset: -2px; }
      .bin-item.is-used figcaption { color: var(--frost); }

      .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 2px 12px 14px; }
      .preset { display: flex; flex-direction: column; gap: 5px; text-align: left; font-size: 12px; color: var(--ice); }
      .preset-art { height: 62px; display: grid; place-items: center; background: var(--hull); color: var(--frost); font: 700 24px var(--sign); }
      .preset:hover .preset-art { background: var(--deep); }
      .pv-caption .preset-art { font: 500 15px var(--body); }
      .pv-lower .preset-art { font: 600 16px var(--sign); place-items: end start; padding: 8px; }
      .pv-meme .preset-art { font: 800 24px "Big Shoulders Stencil"; }
      .pv-outline .preset-art { color: transparent; -webkit-text-stroke: 1px var(--frost); }
      .pv-note .preset-art { font: 400 15px var(--mono); color: var(--ice); }

      .group-title { padding: 2px 12px 8px; }
      .stickers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 12px 14px; }
      .sticker { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px 6px; background: var(--deep); font-size: 11px; color: var(--ice); }
      .sticker:hover { background: var(--deep-3); }
      .sticker .seal-use { width: 56px; height: 47px; overflow: visible; }
      .st-squish { transform: scale(1.14, 0.72); } .st-tall { transform: scale(0.72, 1.14); } .st-tilt { transform: rotate(-16deg); } .st-side { transform: rotate(90deg) scale(0.86); } .st-flip { transform: rotate(180deg); }

      .trans { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 8px; padding: 12px; }
      .tr-card { text-align: left; font-size: 12px; color: var(--ice); display: flex; flex-direction: column; gap: 4px; padding: 0; }
      .tr-card.is-used .tr-art { outline: 2px solid var(--tag); outline-offset: -2px; }
      .tr-art { display: flex; aspect-ratio: 16 / 9; overflow: hidden; background: var(--hull); }
      .tr-art img { width: 50%; object-fit: cover; }

      /* Preview */
      .stage { min-width: 0; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) 44px; background: var(--hull); }
      .frame-wrap { min-height: 0; display: grid; place-items: center; padding: 14px; container-type: size; }
      .frame { position: relative; width: min(100cqw, calc(100cqh * 16 / 9)); aspect-ratio: 16 / 9; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
      .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .caption { position: absolute; inset: auto 0 11% 0; text-align: center; font: 800 clamp(16px, 3.4cqw, 34px)/1 var(--body); color: #fff; text-shadow: 0 2px 0 #000, 0 0 6px #000; }
      .transport { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 12px; background: var(--deep); border-top: 1px solid var(--line); }
      .tc { font: 500 14px var(--mono); }
      .tc span { color: var(--ice-dim); font-size: 12px; font-weight: 400; }
      .tp-btns { display: flex; align-items: center; gap: 2px; }
      .tp-play { width: 34px; height: 34px; display: grid; place-items: center; background: var(--frost); color: var(--hull); border-radius: 2px; margin: 0 4px; }
      .tp-play .ico { fill: currentColor; }
      .tp-right { justify-self: end; color: var(--ice); font: 500 12px var(--mono); }

      /* Inspector */
      .insp-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 11px 12px 9px; }
      .insp-title b { font: 600 18px/1 var(--sign); letter-spacing: 0.04em; text-transform: uppercase; }
      .insp-title span { font: 400 11px var(--mono); color: var(--ice-dim); }
      .itabs { display: flex; gap: 0; padding: 0 12px; border-bottom: 1px solid var(--line); }
      .itab { position: relative; flex: 1; height: 30px; color: var(--ice); font: 600 13.5px/1 var(--sign); letter-spacing: 0.05em; text-transform: uppercase; }
      .itab:hover { color: var(--frost); }
      .itab.is-active { color: var(--tag); box-shadow: inset 0 -2px 0 var(--tag); }
      .sect { padding: 12px; border-bottom: 1px solid var(--line); }
      .sect h4 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
      .sect-reset { padding: 0; color: var(--ice-dim); }
      .sect-reset .ico { width: 13px; height: 13px; }
      .prop { display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 8px; min-height: 28px; color: var(--ice); }
      .prop:not(.has-slider) .val { grid-column: 3; }
      .val { font: 500 12px var(--mono); color: var(--frost); padding: 3px 6px; background: var(--deep); min-width: 62px; text-align: right; }
      .val small { font-size: 10px; color: var(--ice-dim); margin-left: 2px; }
      .prop.is-changed .val { box-shadow: inset 2px 0 0 var(--buoy); }
      .slider { height: 2px; background: var(--line); position: relative; }
      .slider i { position: absolute; inset: 0 auto 0 0; background: var(--ice); }
      .slider i::after { content: ""; position: absolute; right: -2px; top: -5px; width: 4px; height: 12px; background: var(--frost); }
      .seg { display: flex; gap: 1px; background: var(--line); }
      .seg button { flex: 1; height: 28px; background: var(--deep); color: var(--ice); font: 600 13px var(--sign); text-transform: uppercase; letter-spacing: 0.05em; }
      .seg .is-active { background: var(--frost); color: var(--hull); }
      .kv { display: flex; justify-content: space-between; min-height: 26px; align-items: center; color: var(--ice); }
      .kv b { font-weight: 500; color: var(--frost); }

      /* Timeline */
      .tl { display: flex; flex-direction: column; min-height: 0; background: var(--deep); border-top: 2px solid var(--line); }
      .tl-tools { height: 36px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line); }
      .tl-tools .grow { flex: 1; }
      .tl-tools .note { font: 400 11px var(--mono); color: var(--ice-dim); }
      #timeline { position: relative; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--hull); }
      .tl-row { display: grid; grid-template-columns: var(--head) 1fr; flex: 1; border-bottom: 1px solid #143640; min-height: 0; }
      .tl-row.is-main { flex: 1.7; }
      .tl-ruler { flex: none; height: 24px; background: var(--deep); border-bottom: 1px solid var(--line); }
      .tl-corner, .tl-head { background: var(--deep); border-right: 1px solid var(--line); }
      .tl-head { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; color: var(--ice); }
      .tl-id { display: flex; align-items: center; gap: 5px; font: 500 12px var(--mono); }
      .tl-id .ico { width: 13px; height: 13px; }
      .tl-btns { display: flex; gap: 5px; color: var(--ice-dim); }
      .tl-btns .ico { width: 12px; height: 12px; }
      .ruler, .lane { position: relative; overflow: hidden; }
      .tick { position: absolute; bottom: 0; width: 1px; height: 5px; background: var(--ice-dim); }
      .tick.is-major { height: 11px; background: var(--ice); }
      .tick b { position: absolute; left: 4px; bottom: 5px; font: 400 10px var(--mono); color: var(--ice); }

      .clip { position: absolute; top: 3px; bottom: 3px; overflow: hidden; display: flex; align-items: center; color: #fff; box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.18); }
      .film { position: absolute; inset: 0; background-size: auto 100%; background-repeat: repeat-x; filter: saturate(0.82); }
      .clip-name { position: relative; padding: 0 6px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
      .k-video .clip-name { align-self: flex-start; margin-top: 3px; padding: 1px 5px 1px 4px; background: rgb(11 35 41 / 0.72); }
      .k-text { background: #7c5b12; }
      .k-sticker { background: #2f7867; }
      .k-audio { background: #173f54; color: #bfe3f2; }
      .wave { position: absolute; inset: 22% 0 10%; width: 100%; height: 68%; fill: #5fa9c9; }
      .k-audio .clip-name { align-self: flex-start; margin-top: 2px; }
      .clip.is-sel::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px var(--buoy); }
      .clip-tag {
        position: relative; align-self: flex-start; margin-top: 3px; margin-left: 3px; height: 16px; padding: 0 5px 0 12px; display: inline-flex; align-items: center;
        background: var(--tag); color: var(--tag-ink); font: 600 10px var(--mono);
        clip-path: polygon(5px 0, 100% 0, 100% 100%, 5px 100%, 0 70%, 0 30%);
      }
      .clip-tag::before { content: ""; position: absolute; left: 4px; top: 6px; width: 4px; height: 4px; border-radius: 50%; background: #0b2329; }
      .k-video .clip-tag + .clip-name { margin-left: 3px; }
      .cut { position: absolute; top: 50%; width: 11px; height: 11px; margin: -6px 0 0 -6px; background: var(--deep-3); transform: rotate(45deg); box-shadow: 0 0 0 1px var(--ice); z-index: 2; }
      .cut.is-on { background: var(--tag); box-shadow: 0 0 0 1px var(--hull); }

      .playhead { position: absolute; top: 0; bottom: 0; left: calc(var(--head) + (100% - var(--head)) * var(--at)); width: 1px; background: var(--buoy); z-index: 5; pointer-events: none; }
      .playhead::before { content: ""; position: absolute; top: 0; left: -6px; width: 13px; height: 16px; background: var(--buoy); clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%); }

      /* Other pages */
      .sheet { height: 100%; overflow: auto; background: var(--deep-2); padding: 26px 32px; }
      .sheet h1 { margin: 0 0 18px; font: 800 38px/1 "Big Shoulders Stencil", sans-serif; letter-spacing: 0.04em; text-transform: uppercase; }
      .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px 14px; }
      .lib-card { margin: 0; }
      .lib-card figcaption { display: flex; flex-direction: column; gap: 1px; margin-top: 6px; }
      .lib-card b { font-weight: 500; }
      .lib-card figcaption span { font: 400 11px var(--mono); color: var(--ice-dim); }
      .queue { list-style: none; padding: 0; margin: 0; max-width: 820px; }
      .job { display: grid; grid-template-columns: 112px 1fr auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
      .job img { width: 112px; aspect-ratio: 16 / 9; object-fit: cover; display: block; }
      .job-text { display: flex; flex-direction: column; gap: 3px; }
      .job-text b { font: 600 18px/1 var(--sign); letter-spacing: 0.03em; }
      .job-text span { font: 400 11.5px var(--mono); color: var(--ice); }
      .bar { height: 3px; margin-top: 5px; background: var(--deep); }
      .bar i { display: block; height: 100%; background: var(--buoy); }
      .is-done .bar i { background: var(--kelp); }
      .job-state { font: 500 12px var(--mono); color: var(--ice); }
      .is-running .job-state { color: var(--buoy); }

      .empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: var(--deep-2); text-align: center; }
      .empty .seal-use { width: 210px; height: 175px; margin-bottom: 14px; }
      .empty h1 { margin: 0; font: 800 38px/1 "Big Shoulders Stencil", sans-serif; letter-spacing: 0.04em; text-transform: uppercase; }
      .empty p { margin: 0; max-width: 40ch; color: var(--ice); font-size: 14px; }
      @media (max-width: 1100px) { .upper { grid-template-columns: 76px 230px minmax(0, 1fr) 0; } .insp { display: none; } }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    </style>
  </head>
  <body>
    <!-- The seal as a two-ink print, tagged on its flipper. Portrait of the real plush: round, mottled, deadpan. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="seal" viewBox="0 0 120 100">
        <path d="M60 6c30 0 54 20 54 49 0 25-24 39-54 39S6 80 6 55C6 26 30 6 60 6z" fill="#d5e1df" />
        <g fill="#6c8a90">
          <ellipse cx="38" cy="19" rx="5" ry="3.2" transform="rotate(-24 38 19)" /><ellipse cx="53" cy="13" rx="3.2" ry="2.2" /><ellipse cx="70" cy="15" rx="5.2" ry="3" transform="rotate(12 70 15)" /><ellipse cx="86" cy="23" rx="4.2" ry="2.8" transform="rotate(30 86 23)" />
          <ellipse cx="24" cy="33" rx="3.6" ry="2.6" transform="rotate(-40 24 33)" /><ellipse cx="46" cy="28" rx="2.4" ry="1.7" /><ellipse cx="62" cy="27" rx="3.4" ry="2.1" /><ellipse cx="77" cy="32" rx="2.2" ry="1.6" /><ellipse cx="97" cy="36" rx="3.8" ry="2.6" transform="rotate(46 97 36)" />
          <ellipse cx="15" cy="50" rx="2.6" ry="3.6" /><ellipse cx="105" cy="52" rx="2.8" ry="3.8" /><ellipse cx="22" cy="68" rx="3.8" ry="2.6" transform="rotate(30 22 68)" /><ellipse cx="96" cy="70" rx="4" ry="2.6" transform="rotate(-30 96 70)" /><ellipse cx="36" cy="82" rx="3.2" ry="2.1" /><ellipse cx="84" cy="83" rx="3" ry="2" />
        </g>
        <ellipse cx="40" cy="49" rx="6.4" ry="4.4" transform="rotate(10 40 49)" fill="#102d35" />
        <ellipse cx="80" cy="49" rx="6.4" ry="4.4" transform="rotate(-10 80 49)" fill="#102d35" />
        <circle cx="42" cy="47.6" r="1.2" fill="#fff" /><circle cx="82" cy="47.6" r="1.2" fill="#fff" />
        <ellipse cx="50" cy="66" rx="11.5" ry="8.5" fill="#f3f7f6" /><ellipse cx="70" cy="66" rx="11.5" ry="8.5" fill="#f3f7f6" />
        <path d="M54.5 55.5h11l-5.5 6z" fill="#102d35" stroke="#102d35" stroke-width="2" stroke-linejoin="round" />
        <path d="M60 61v5" stroke="#102d35" stroke-width="1.8" stroke-linecap="round" />
        <g fill="#6c8a90"><circle cx="45" cy="64" r="0.9" /><circle cx="50" cy="68" r="0.9" /><circle cx="75" cy="64" r="0.9" /><circle cx="70" cy="68" r="0.9" /></g>
        <path d="M92 76l17 3.5-2.4 11.5-17-3.5z" fill="#f6c41a" />
        <circle cx="94" cy="81" r="1.6" fill="#12323b" />
      </symbol>
      <symbol id="seal-mark" viewBox="0 0 120 100">
        <path d="M60 6c30 0 54 20 54 49 0 25-24 39-54 39S6 80 6 55C6 26 30 6 60 6z" fill="#d5e1df" />
        <g fill="#6c8a90"><ellipse cx="36" cy="20" rx="7" ry="4.6" transform="rotate(-24 36 20)" /><ellipse cx="62" cy="15" rx="6" ry="3.8" /><ellipse cx="88" cy="25" rx="6.4" ry="4.2" transform="rotate(30 88 25)" /></g>
        <ellipse cx="38" cy="50" rx="9" ry="7" fill="#102d35" /><ellipse cx="82" cy="50" rx="9" ry="7" fill="#102d35" />
        <ellipse cx="60" cy="71" rx="24" ry="12" fill="#f3f7f6" />
        <path d="M52 60h16l-8 8z" fill="#102d35" stroke="#102d35" stroke-width="2.4" stroke-linejoin="round" />
        <path d="M92 76l17 3.5-2.4 11.5-17-3.5z" fill="#f6c41a" />
      </symbol>
    </svg>

    <div class="app">
      <header class="top">
        <div class="brand">
          <svg class="seal-use" viewBox="0 0 120 100" aria-hidden="true"><use href="#seal-mark" /></svg>
          <span class="word">CLOUDY CLIP</span>
          <span class="project"><b>Focas saltando por el mundo</b></span>
        </div>
        <nav class="pages" role="tablist" aria-label="Pages">
          <button class="pg" data-go="page:edit">Edit</button>
          <button class="pg" data-go="page:media">Media</button>
          <button class="pg" data-go="page:sound">Sound</button>
          <button class="pg" data-go="page:export">Export</button>
        </nav>
        <div class="right">
          <button class="icon" data-i="undo" title="Undo"></button>
          <button class="icon" data-i="redo" title="Redo"></button>
          <div class="avatars"><span class="av claude" title="Claude Code">✳</span><span class="av" title="You">M</span></div>
          <button class="btn btn-primary" data-i="export">Export</button>
        </div>
      </header>

      <main class="page" data-show="page:edit">
        <div class="edit">
          <div class="upper">
            <nav class="rail" role="tablist" aria-label="Library">
              <button class="rail-tab" data-go="tool:media" data-i="media">Media</button>
              <button class="rail-tab" data-go="tool:text" data-i="text">Text</button>
              <button class="rail-tab" data-go="tool:stickers" data-i="sticker">Stickers</button>
              <button class="rail-tab" data-go="tool:transitions" data-i="trans">Transitions</button>
            </nav>
            <aside class="pane">
              <div data-show="tool:media" data-fill="media"></div>
              <div data-show="tool:text" data-fill="text"></div>
              <div data-show="tool:stickers" data-fill="stickers"></div>
              <div data-show="tool:transitions" data-fill="transitions"></div>
            </aside>
            <section class="stage">
              <div class="frame-wrap">
                <div class="frame"><img src="footage/highway.jpg" alt="Seals on a highway" /><div class="caption">they have left the beach</div></div>
              </div>
              <div class="transport">
                <div class="tc">0:04.9 <span>/ 0:18.0</span></div>
                <div class="tp-btns">
                  <button class="icon" data-i="prev" title="Previous cut"></button>
                  <button class="tp-play" data-i="play" title="Play"></button>
                  <button class="icon" data-i="next" title="Next cut"></button>
                </div>
                <div class="tp-right">1920 × 1080 · 100%</div>
              </div>
            </section>
            <aside class="insp">
              <div class="insp-title"><b>Highway</b><span>clip 02</span></div>
              <nav class="itabs" role="tablist" aria-label="Clip">
                <button class="itab" data-go="insp:video">Video</button>
                <button class="itab" data-go="insp:audio">Audio</button>
                <button class="itab" data-go="insp:cut">Transition</button>
                <button class="itab" data-go="insp:file">File</button>
              </nav>
              <div data-show="insp:video" data-fill="inspVideo"></div>
              <div data-show="insp:audio" data-fill="inspAudio"></div>
              <div data-show="insp:cut" data-fill="inspTransition"></div>
              <div data-show="insp:file" data-fill="inspFile"></div>
            </aside>
          </div>
          <section class="tl">
            <div class="tl-tools">
              <button class="icon" data-i="split" title="Split at playhead"></button>
              <button class="icon" data-i="cut" title="Ripple delete"></button>
              <button class="icon" data-i="trash" title="Delete"></button>
              <span class="grow"></span>
              <span class="note">7 clips · 18.0 s</span>
            </div>
            <div id="timeline"></div>
          </section>
        </div>
      </main>

      <main class="page" data-show="page:media"><div class="sheet"><h1>Media</h1><div data-fill="library"></div></div></main>
      <main class="page" data-show="page:sound">
        <div class="empty">
          <svg class="seal-use" viewBox="0 0 120 100" aria-hidden="true"><use href="#seal" /></svg>
          <h1>Sound is on the way</h1>
          <p>Mixing lands here later. Audio clips keep working on the Edit timeline.</p>
        </div>
      </main>
      <main class="page" data-show="page:export"><div class="sheet"><h1>Export queue</h1><div data-fill="queue"></div></div></main>
    </div>

    <script src="shared.js"></script>
    <script>
      boot({
        clip: (c) => (c.kind === "video" ? `<span class="clip-tag">${String(c.n).padStart(2, "0")}</span>` : ""),
      });
    </script>
  </body>
