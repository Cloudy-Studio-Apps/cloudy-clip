<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cloudy Clip, Tint page D: Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Courier+Prime:wght@400;700&family=Shantell+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tint-shared.css">
<style>
  /* Layout A, Workbench: grade and viewer on top, clips in the middle, tools and scopes along the bottom (Resolve's arrangement) */
  #page{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) 112px 318px;gap:1px;background:var(--rule-2)}
  .upper{min-height:0;display:grid;grid-template-columns:360px minmax(0,1fr);gap:1px;transition:grid-template-columns .25s}
  body.leader .upper{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
  .lower{min-height:0;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:1px}
  .tbody{flex:1;min-height:0;overflow:auto;padding:12px 14px}
  .scopes{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1px;background:var(--rule)}
  .scopes>div{position:relative;display:flex;min-height:0}
  .scopes .scope[hidden]{display:none}
  .looks-pane{flex:1;min-height:0;display:flex;flex-direction:column}
  .basics{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr);gap:28px}
  .bh{font:700 13px var(--hand);color:var(--ink-3);margin-bottom:6px;padding-bottom:4px;border-bottom:1px dashed var(--rule-2)}
  .quick{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  body.shownew .new{outline:1.5px dashed var(--red);outline-offset:1px}
  .mark{font:700 12px var(--hand);color:var(--ink-3);padding:4px 8px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--rule-2)}
  .mark.on{color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
  .seg{display:inline-flex;padding:1px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--rule-2)}
  .seg button{height:22px;padding:0 8px;font:700 12px var(--hand);color:var(--ink-3);border-radius:2px}
  .seg button.on{background:var(--paper-2);color:var(--ink)}
  .ptab{padding:0 7px}
  .wtop{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .cmix{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,.9fr);gap:24px}
  .dots{display:flex;gap:6px;margin-bottom:10px}
  .dots button{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 1px var(--rule-2)}
  .dots button.on{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
  .bars{display:flex;gap:6px;align-items:flex-end;height:96px;padding:6px;background:var(--table);border-radius:3px}
  .bars i{flex:1;display:block;border-radius:2px 2px 0 0;opacity:.85}
  .three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
  .mwheel{display:flex;gap:16px}
  .matrix{display:grid;grid-template-columns:52px repeat(3,1fr);gap:4px;align-items:center}
  .matrix b{font:700 11px var(--mono);color:var(--ink-3);text-align:center}
  .matrix span{font:400 12px var(--mono);background:var(--table);padding:3px 6px;border-radius:2px;text-align:right;border-bottom:2px solid var(--c)}
  .later{font:700 10.5px var(--mono);color:#e8b86b;box-shadow:inset 0 0 0 1px #8a6a38;padding:1px 5px;border-radius:2px;margin-left:6px}
  .guides{position:absolute;inset:5% 5%;border:1px dashed rgb(236 239 241/.55);z-index:3;pointer-events:none;display:none}
  .guides::after{content:"";position:absolute;inset:6% 6%;border:1px dashed rgb(236 239 241/.35)}
  .guides.on{display:block}
  .fc-legend{position:absolute;left:8px;bottom:8px;z-index:3;display:none;gap:0;font:700 10px var(--mono)}
  .fc-legend.on{display:flex}
  .fc-legend span{padding:2px 5px;color:#0e1013}
  .ptab.ic .lb{display:none}
  .ptab.ic.on .lb{display:inline}
  .ptab.ic{padding:0 8px}
  .ptab.ic.on{color:var(--ink)}
  .icon.lit{color:var(--blue);background:rgb(111 183 230/.1)}
  .seg.ic button{width:28px;padding:0;display:grid;place-items:center}
  .vchip{height:24px;padding:0 7px;border-radius:3px;font:700 12px var(--mono);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule-2);display:inline-flex;align-items:center;gap:4px}
  .info{display:inline-grid;place-items:center;width:16px;height:16px;margin-left:6px;color:var(--ink-3);vertical-align:-3px;cursor:help}
  .info:hover{color:var(--ink)}
  .info .ico{width:14px;height:14px}
  .bh{display:flex;align-items:center}
  .quick{flex-direction:row!important;flex-wrap:wrap}
  .quick .btn{width:40px;height:34px;padding:0;justify-content:center}
  .quick .btn .ico{width:18px;height:18px}
  #tip{position:fixed;z-index:100;max-width:270px;padding:7px 10px 8px;background:var(--paper-2);border-radius:5px;box-shadow:0 0 0 1px var(--rule-2),0 8px 24px rgb(0 0 0/.55);font:400 12px/1.4 var(--body);color:var(--ink-2);pointer-events:none;opacity:0;transition:opacity .08s}
  #tip.on{opacity:1}
  #tip b{display:block;font:700 13px var(--hand);color:var(--ink);margin-bottom:2px}
  #tip kbd{font:700 10.5px var(--mono);padding:0 4px;border-radius:2px;box-shadow:inset 0 0 0 1px var(--rule-2);color:var(--ink);margin-left:6px}
</style>
<style id="breathe">
  /* D, Studio: the same colors and fonts as C. Only the layout changes: panels float on the table with gutters,
     tools get a rail of their own, controls sit in measured columns, and every row has room. */
  #page{padding:8px;gap:8px;background:var(--table);grid-template-rows:minmax(0,1fr) 172px 330px}
  .upper,.lower{gap:8px}
  .upper{grid-template-columns:372px minmax(0,1fr)}
  body.leader .upper{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
  .panel{border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--rule)}
  .ph{height:38px;padding:0 8px 0 14px;gap:4px;background:var(--paper);border-bottom:1px solid var(--rule)}
  .ph .t{margin-right:10px}
  .ph .who{margin-left:2px}
  .ph .sep{margin:0 8px}
  .icon{width:30px;height:30px}
  /* layers: room between rows, larger thumbs */
  .layers{padding:10px 12px;gap:6px}
  .layer{padding:6px 10px 6px 8px;gap:10px;grid-template-columns:12px 22px 64px minmax(0,1fr) auto}
  .layer .thumb{width:64px;height:36px}
  .layer .meta{margin-top:5px}
  .group{padding:6px 8px 8px}
  .group-h{padding:4px 2px 8px}
  .kids{gap:6px;padding-left:12px}
  .group .hint{padding-top:8px!important}
  .sealed{padding:8px}
  .flow{padding:4px 4px}
  .addrow{padding:10px 12px}
  /* viewer: a wider margin around the picture */
  .shot{width:min(100cqw - 64px,(100cqh - 56px)*16/9)}
  .vbar{height:40px;padding:0 12px;gap:6px}
  /* clips */
  .strip{padding:10px 12px 4px;gap:10px}
  .sclip{width:128px}
  .sclip .meta{font:400 10.5px var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini-tl{flex:none;height:22px;position:relative;margin:2px 12px 10px;background:var(--table);border-radius:3px}
  .mini-tl i{position:absolute;height:6px;border-radius:1px;background:var(--rule-2)}
  .mini-tl i.v2{top:3px}.mini-tl i.v1{top:12px}
  .mini-tl i.sel{background:var(--blue)}
  .mini-tl b{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--red)}
  .mini-tl span{position:absolute;right:6px;top:4px;font:400 10.5px var(--mono);color:var(--ink-3)}
  /* tools: a vertical rail, then a header that names the tool, then measured columns */
  .tpanel{flex-direction:row!important}
  .rail{width:52px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;background:var(--paper-2);border-right:1px solid var(--rule);overflow:auto}
  .rail .ptab{width:38px;height:36px;padding:0;justify-content:center;border-radius:4px}
  .rail .ptab .lb{display:none!important}
  .rail .ptab.on{background:var(--paper);box-shadow:inset 3px 0 0 var(--red)}
  .rail .sep{width:22px;height:0;border-left:0;border-top:1px dashed var(--rule-2);margin:6px 0}
  .tmain{flex:1;min-width:0;display:flex;flex-direction:column}
  .tmain .ph .t{font-size:14px}
  .tbody{padding:16px 24px 16px}
  .sl{min-height:32px;grid-template-columns:96px minmax(120px,1fr) 60px;gap:12px}
  .sl output{padding:3px 7px;cursor:ew-resize;user-select:none}
  .sl label{user-select:none;position:relative}
  .sl.chg label::before{content:"";position:absolute;left:-10px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--blue)}
  .bh{margin-bottom:12px;padding-bottom:7px}
  .basics,.three,.two,.cmix{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))!important;gap:20px 44px!important;max-width:1180px}
  .wrow{display:grid;grid-template-columns:auto minmax(260px,400px);gap:48px;align-items:start}
  .wrow .wheels{grid-template-columns:repeat(4,128px);gap:22px}
  .wrow .nums span{min-width:28px;font-size:10px;padding:1px 2px}
  .wrow{gap:40px}
  .prims>div{grid-template-columns:1fr!important;gap:0!important;margin:0!important}
  .wtop{margin-bottom:16px}
  .wheels{gap:24px;max-width:1000px}
  .nums{margin-top:2px}
  .wheel{gap:9px}
  .quick{gap:10px!important}
  .quick .btn{width:46px;height:40px}
  .curves{grid-template-columns:minmax(0,560px) 180px;gap:24px}
  .curve-box{min-height:220px}
  .lut-list{gap:4px}
  .lut-list button{padding:7px 10px}
  .dots{gap:10px;margin-bottom:16px}
  .matrix{gap:8px}
  /* scopes: breathing room around each trace */
  .scopes{gap:8px;padding:8px;background:var(--paper)}
  .scopes>div{border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px var(--rule)}
  .addrow{align-items:center;gap:8px}
  .zones{display:grid;grid-template-columns:repeat(6,84px);gap:14px}
  .zones .nums span{min-width:40px}
  .zones input[type=range]{width:78px}
  .limrow{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:20px 44px;max-width:1180px}
  .lhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;font:700 13px var(--hand)}
  .lhead .btn{height:24px;padding:0 8px}
  .chart{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:6px;background:var(--table-2);border-radius:3px;margin-bottom:10px;max-width:200px}
  .chart i{display:block;aspect-ratio:1;border-radius:1px}
  .col-btns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .warp{display:grid;grid-template-columns:232px minmax(240px,360px);gap:44px;align-items:start}
  .wbox{width:232px;height:232px;border-radius:50%;touch-action:none;background:radial-gradient(circle,#d9dde0 0,rgb(217 221 224/0) 72%),conic-gradient(from 90deg,hsl(0 70% 55%),hsl(60 70% 55%),hsl(120 60% 50%),hsl(180 60% 50%),hsl(240 65% 60%),hsl(300 65% 58%),hsl(360 70% 55%));box-shadow:0 0 0 1px var(--rule-2)}
  .wbox svg{width:100%;height:100%;overflow:visible}
  .wbox line,.wbox polygon{stroke:rgb(20 23 27/.7);stroke-width:1;fill:none}
  .wbox circle{fill:var(--ink);stroke:var(--table);stroke-width:1.5;cursor:grab}
  .wbox circle.moved{fill:var(--red)}
  .shot.sampling{cursor:crosshair}
  .probe{position:absolute;z-index:6;pointer-events:none;padding:4px 7px;background:rgb(14 16 19/.9);border-radius:3px;font:400 11px var(--mono);white-space:nowrap;display:none}
  .pin{position:absolute;z-index:5;width:14px;height:14px;margin:-7px 0 0 -7px;border:1.5px solid var(--ink);border-radius:50%;pointer-events:none;box-shadow:0 0 0 1px #000}
  .pin b{position:absolute;left:12px;top:-13px;font:700 10px var(--mono);color:var(--ink);text-shadow:0 0 3px #000}
  .pins{position:absolute;left:8px;top:8px;z-index:5;display:flex;flex-direction:column;gap:2px;font:400 11px var(--mono)}
  .pins div{background:rgb(14 16 19/.85);padding:2px 6px;border-radius:2px}
  .pins span{color:var(--ink-3)}
  .tag.bypass{left:50%;transform:translateX(-50%);color:var(--red)}
  body.cinema .upper>section:last-child{position:fixed;inset:0;z-index:80;border-radius:0}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;padding:9px 14px;background:var(--paper-2);border-radius:5px;box-shadow:0 0 0 1px var(--rule-2),0 10px 30px rgb(0 0 0/.5);font:400 12.5px var(--body);display:none}
  .toast.on{display:block}
  #ppmenu{position:fixed}
  .limrow .sl{grid-template-columns:84px minmax(60px,1fr) 56px}
  #ppmenu button .toggle{margin-right:2px}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 120 100"><use href="#seal"/></svg><span class="word">cloudy clip</span><span class="project">Golden hour</span>
      <span class="layout-tag">Layout D · Studio · <a href="tint-a-workbench.html">A</a> · <a href="tint-b-darkroom.html">B</a> · <a href="tint-c-hybrid.html">C</a></span></div>
    <nav class="pages">
      <button class="pg" data-ic="image">Media</button>
      <button class="pg" data-ic="scissors">Edit</button>
      <button class="pg is-active" data-ic="palette">Tint</button>
      <button class="pg" data-ic="lines">Sound</button>
      <button class="pg" data-ic="upload">Export</button>
    </nav>
    <div class="right">
      <div class="seals" data-tip="Baby Seal or Leader Seal|The same grade, shown as layers or as nodes. Switch any time; nothing changes.">
        <button class="baby on" data-mode="baby"><svg viewBox="0 0 120 100"><use href="#seal"/></svg>Baby Seal <small>layers</small></button>
        <button data-mode="leader"><svg viewBox="0 0 120 110"><use href="#leader"/></svg>Leader Seal <small>nodes</small></button>
      </div>
      <button id="newbtn" class="mark">Mark new tools</button><span class="av">M</span><span class="av claude">✳</span>
    </div>
  </header>

  <main id="page">
    <div class="upper">
      <section class="panel">
        <div class="ph">
          <button class="ptab ic on" data-left="grade" data-tip="Grade|The corrections on this clip, top to bottom."><span class="baby-only" data-ic="list"></span><span class="leader-only" data-ic="nodes"></span><span class="lb baby-only">Layers</span><span class="lb leader-only">Nodes</span></button>
          <button class="ptab ic" data-left="looks" data-tip="Looks|Stills you grabbed and saved looks. Click one to apply it." data-ic="still"><span class="lb">Looks</span></button>
          <span class="who">02 Plaza wide</span><span class="grow"></span>
          <button class="icon" data-tip="Copy grade|Copy every correction on this clip.<kbd>Ctrl C</kbd>" data-ic="copy"></button><button class="icon" data-tip="Paste grade|Replace this clip&#39;s grade with the copied one.<kbd>Ctrl V</kbd>" data-ic="paste"></button><button class="icon" data-tip="Reset grade|Remove every correction from this clip." data-ic="reset"></button>
        </div>
        <div data-leftbody="grade" style="flex:1;min-height:0;display:flex;flex-direction:column">
          <div class="baby-only" style="flex:1;min-height:0;display:flex;flex-direction:column">
            <div class="layers" id="layers"></div>
            <div class="addrow"><button class="btn primary" data-add data-tip="Add|A correction, a group or a look, above the selected layer. Top runs first; drag to reorder.<kbd>Alt S</kbd>">+ Add</button><div id="addhost"></div></div>
          </div>
          <div class="graph leader-only" id="graph"></div>
        </div>
        <div class="looks-pane" data-leftbody="looks" hidden>
          <div class="looks" id="looks"></div>
          <div class="addrow"><button class="btn primary" data-tip="Grab still|Save this frame and its grade as a look.">Grab still</button><button class="btn" data-tip="Apply to selected clips|Paste this look onto every selected clip.">Apply to selected</button></div>
        </div>
      </section>

      <section class="panel">
        <div class="ph"><span class="t">Viewer</span><span class="who">02 Plaza wide · 0:04.12</span><span class="grow"></span>
          <button class="icon" id="cmp" data-ic="split" data-tip="Before / after|Wipe between the original and the grade. Drag the line.<kbd>\\</kbd>"></button><button class="icon" data-ic="side" data-tip="Side by side|This clip next to another clip or a still, to match them."></button><button class="icon new" id="bybtn" data-ic="power" data-tip="Bypass grades|See every clip with no grade at all, to judge what you changed.<kbd>Shift D</kbd>"></button><span class="sep"></span><button class="icon new" id="smbtn" data-ic="crosshair" data-tip="Sample points|Hover the picture to read its color. Click to pin up to three points and watch them while you grade."></button><button class="icon" id="fcbtn" data-ic="falsecolor" data-tip="False color|Paints brightness as colors: crushed blacks, skin level and clipping at a glance."></button><button class="icon" id="gdbtn" data-ic="guides" data-tip="Guides|Safe areas for titles and action."></button><button class="icon new" id="wnbtn" data-ic="zebra" data-tip="Clip warning|Marks blown-out areas in magenta, so you see what detail is lost."></button><span class="sep"></span>
          <span class="cs" data-tip="Color space|Camera S-Log3, shown as Rec.709. Change it in LUT and color.">S-Log3 → 709</span><span class="cs" style="margin-left:4px" data-tip="Zoom|Fit to the viewer.<kbd>Shift Z</kbd>">44%</span><span class="sep"></span><button class="icon new" id="cnbtn" data-ic="maximize" data-tip="Clean viewer|Only the picture, full screen. Esc to leave. Right-click to send it to a second screen.<kbd>Ctrl F</kbd>"></button>
        </div>

          <button class="icon" data-ic="back" data-tip="Previous clip|<kbd>↑</kbd>"></button><button class="tp-play" data-ic="play" data-tip="Play|<kbd>Space</kbd>"></button><button class="icon" data-ic="fwd" data-tip="Next clip|<kbd>↓</kbd>"></button><button class="icon lit" data-ic="loop" data-tip="Loop|Repeat the clip while you grade."></button>
          <span class="grow"></span><button class="icon" data-tip="Grab still|Save this frame and its grade to Looks.<kbd>Ctrl Alt G</kbd>" data-ic="still"></button>

    <section class="panel">
      <div class="ph"><span class="t">Clips</span><span class="who">8 in Main · 3 graded</span><span class="grow"></span>
        <span class="seg ic"><button class="on" data-ic="square" data-tip="This clip|The grade applies to this clip only."></button><button data-ic="folder" data-tip="Shot group|One grade shared by every Plaza shot, under each clip&#39;s own."></button><button data-ic="timeline" data-tip="Whole timeline|A grade over the finished edit, after every clip, like an adjustment layer."></button></span>
        <button class="vchip" style="margin-left:6px" data-tip="Versions|Keep several grades on a clip and flip between them."><span data-ic="version"></span>A ▾</button><span class="sep"></span>
        <button class="icon" data-ic="copy" data-tip="Copy grade|<kbd>Ctrl C</kbd>"></button><button class="icon" data-ic="paste" data-tip="Paste grade|Onto the selected clips.<kbd>Ctrl V</kbd>"></button><button class="icon new" id="ppbtn" data-ic="pastepart" data-tip="Paste part of a grade|Choose what to paste: only the balance, only the wheels, only the LUT…"></button><button class="icon" data-ic="pasteall" data-tip="Paste to all|Onto every clip in the strip."></button><button class="icon new" data-ic="wand" data-tip="Match all to this|Match every selected clip to this one in one click."></button><button class="icon" data-ic="folder" data-tip="Make a shot group|Group the selected clips so they share one grade."></button>
      </div>
      <div class="strip" id="strip"></div>
    </section>

    <div class="lower">
      <section class="panel tpanel">
        <div class="rail" id="rail"></div>
